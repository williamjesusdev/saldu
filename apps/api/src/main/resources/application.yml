# Server
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: saldu-backend

  # Profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Datasource
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Jackson (Spring Boot 4.x / Jackson 3.x: WRITE_DATES_AS_TIMESTAMPS removed — ISO-8601 is default)
  jackson:
    default-property-inclusion: non_absent

# Saldu Custom Properties
saldu:
  jwt:
    secret: ${SALDU_JWT_SECRET}
    expiration-ms: ${SALDU_JWT_EXPIRATION_MS}
    cookie-name: ${SALDU_JWT_COOKIE_NAME}
  auth:
    invite-token-validity-days: ${SALDU_AUTH_INVITE_TOKEN_VALIDITY_DAYS:7}
    password-reset-token-validity-hours: ${SALDU_AUTH_PASSWORD_RESET_TOKEN_VALIDITY_HOURS:2}
  admin:
    name: ${SALDU_ADMIN_NAME}
    email: ${SALDU_ADMIN_EMAIL}
    password: ${SALDU_ADMIN_PASSWORD}

# Logging
logging:
  level:
    root: INFO
    com.saldu: INFO
