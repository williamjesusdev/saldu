name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"
          cache-dependency-path: "apps/api/pom.xml"

      - name: Grant execute permission on Maven wrapper
        run: chmod +x apps/api/mvnw

      - name: Setup application properties
        run: cp apps/api/src/main/resources/application-local.example.yml apps/api/src/main/resources/application-local.yml

      - name: Spotless formatting check
        run: cd apps/api && ./mvnw spotless:check

      - name: PMD static analysis & CPD check
        run: cd apps/api && ./mvnw pmd:check pmd:cpd-check

      - name: Unit & Integration tests with Testcontainers
        run: cd apps/api && ./mvnw clean validate test

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci && cd apps/web && npm ci

      - name: Setup environment variables
        working-directory: apps/web
        run: cp .env.example .env

      - name: Prettier formatting check
        working-directory: apps/web
        run: npx prettier --check '{src,tests}/**'

      - name: ESLint check
        run: npm run lint:web

      - name: Unit tests
        run: npm run test:web

      - name: Build verification
        run: npm run build:web

  e2e-ci:
    name: e2e-ci
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"
          cache-dependency-path: "apps/api/pom.xml"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            tests/e2e/package-lock.json

      - name: Grant execute permission on Maven wrapper
        run: chmod +x apps/api/mvnw

      - name: Install Dependencies
        run: npm ci && npm ci --prefix tests/e2e && npm ci --prefix apps/web

      - name: Install Playwright Browsers with OS Dependencies
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Setup environment variables
        run: |
          cp apps/api/src/main/resources/application-local.example.yml apps/api/src/main/resources/application-local.yml
          cp apps/web/.env.example apps/web/.env
          cp tests/e2e/.env.example tests/e2e/.env

      - name: Execute E2E Tests with full stack orchestration
        env:
          CI: true
        run: npm run test:e2e:run:ci

      - name: Upload Playwright HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
